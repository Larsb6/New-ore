plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// The server-side variant reuses the main mod's code and assets from the repository root and only
// adds Polymer integration, so vanilla clients can join without installing anything.
sourceSets {
	main {
		java {
			srcDir '../src/main/java'
		}
	}
}

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Polymer is bundled, so server owners only need this jar and Fabric API
	for (module in ['polymer-core', 'polymer-blocks', 'polymer-resource-pack', 'polymer-autohost',
			'polymer-common', 'polymer-networking', 'polymer-reg-sync-manipulator']) {
		modImplementation "eu.pb4:${module}:${project.polymer_version}"
		include "eu.pb4:${module}:${project.polymer_version}"
	}
}

processResources {
	inputs.property "version", project.version

	from('../src/main/resources') {
		exclude 'fabric.mod.json'
	}

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
